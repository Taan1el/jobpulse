name: Bug report
description: Something does not work as described
labels:
  - bug
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open the page ..."
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen
      options:
        - Live demo
        - Local full stack
        - Docker image
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: "Firefox 130 on Windows 11"
